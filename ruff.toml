# Ruff configuration — https://docs.astral.sh/ruff/
target-version = "py311"
line-length = 88

[lint]
# Select the rule set explicitly instead of inheriting whatever the installed ruff
# happens to default to. Ruff's implicit default is not stable across releases: 0.15
# enabled E4 (so the `# noqa: E402` directives in tests/ were doing real work), while
# 0.16 dropped E4 from the default and added isort, refurb, pylint, flake8-bandit,
# flake8-datetimez, flake8-blind-except and flake8-executable rules. Because this file
# pinned no selection and requirements-dev.txt pinned no version, a routine ruff release
# turned CI red on Python that had not changed in weeks.
#
# This repo is a template people fork, so its first CI run must not fail on rules the
# fork never opted into. Widening this list is a deliberate change with its own PR.
select = ["E4", "E7", "E9", "F"]
